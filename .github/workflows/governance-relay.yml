name: Governance Relay

on:
  issues:
    types:
      - opened

  issue_comment:
    types:
      - created

  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch governance event
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/softbreakcodes/northstarops-governance-private-test/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<EOF
          {
            "event_type": "northstarops-governance-event",
            "client_payload": {
              "source_repo": "${SOURCE_REPO}",
              "source_event": "${SOURCE_EVENT}",
              "issue_number": "${ISSUE_NUMBER}",
              "pr_number": "${PR_NUMBER}",
              "comment_id": "${COMMENT_ID}",
              "actor": "${ACTOR}"
            }
          }
          EOF
