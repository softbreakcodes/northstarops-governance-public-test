name: Governance Relay

on:
  issues:
    types:
      - opened

  issue_comment:
    types:
      - created

  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft
      - closed

  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  issues: read

jobs:
  relay:
    if: >-
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request == null && github.event.comment.body == '/claim')) &&
      (!contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) || github.event.pull_request.head.repo.full_name != github.repository)

    runs-on: ubuntu-latest

    concurrency:
      group: relay-${{ github.repository }}-${{ github.event_name == 'issue_comment' && format('claim-issue-{0}', github.event.issue.number) || format('{0}-{1}', github.event_name, github.run_id) }}
      queue: max

    steps:
      - name: Dispatch lifecycle event
        if: >-
          github.event_name != 'issue_comment' ||
          (
            github.event.issue.state == 'open' &&
            github.event.issue.assignee == null &&
            contains(github.event.issue.labels.*.name, 'status: available')
          )
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_DISPATCH_TOKEN }}
          DISPATCH_EVENT_TYPE: ${{ github.event_name == 'issues' && 'northstarops-publish-event' || github.event_name == 'issue_comment' && 'northstarops-claim-event' || 'northstarops-governance-event' }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/softbreakcodes/northstarops-governance-private-test/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<EOF
          {
            "event_type": "${DISPATCH_EVENT_TYPE}",
            "client_payload": {
              "source_repo": "${SOURCE_REPO}",
              "source_event": "${SOURCE_EVENT}",
              "source_action": "${SOURCE_ACTION}",
              "issue_number": "${ISSUE_NUMBER}",
              "pr_number": "${PR_NUMBER}",
              "comment_id": "${COMMENT_ID}",
              "review_id": "${REVIEW_ID}",
              "actor": "${ACTOR}"
            }
          }
          EOF
