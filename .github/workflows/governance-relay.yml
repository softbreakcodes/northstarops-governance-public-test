name: Governance Relay

on:
  issues:
    types:
      - opened

  issue_comment:
    types:
      - created

  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  issues: write

jobs:
  relay:
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.comment.body == '/claim'

    runs-on: ubuntu-latest

    concurrency:
      group: relay-${{ github.repository }}-${{ github.event_name == 'issue_comment' && format('claim-{0}', github.actor) || format('{0}-{1}', github.event_name, github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'issue_comment' }}

    steps:
      - name: Reply when contributor already claimed this Issue
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.comment.body == '/claim' &&
          github.event.issue.assignee != null &&
          github.event.issue.assignee.login == github.actor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
        run: |
          MESSAGE="ℹ️ @${ACTOR} bu Issue'yu zaten claim yaptın."
          jq -n --arg body "${MESSAGE}" '{body: $body}' \
            | gh api --method POST "repos/${SOURCE_REPO}/issues/${ISSUE_NUMBER}/comments" --input -

      - name: Reply when Issue is claimed by another contributor
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.comment.body == '/claim' &&
          github.event.issue.assignee != null &&
          github.event.issue.assignee.login != github.actor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          ASSIGNEE: ${{ github.event.issue.assignee.login }}
        run: |
          MESSAGE="⚠️ @${ACTOR} bu Issue üzerinde @${ASSIGNEE} tarafından claim yapılmış."
          jq -n --arg body "${MESSAGE}" '{body: $body}' \
            | gh api --method POST "repos/${SOURCE_REPO}/issues/${ISSUE_NUMBER}/comments" --input -

      - name: Dispatch governance event
        if: >-
          github.event_name != 'issue_comment' ||
          (
            github.event.issue.state == 'open' &&
            github.event.issue.assignee == null &&
            contains(github.event.issue.labels.*.name, 'status: available')
          )
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/softbreakcodes/northstarops-governance-private-test/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<EOF
          {
            "event_type": "northstarops-governance-event",
            "client_payload": {
              "source_repo": "${SOURCE_REPO}",
              "source_event": "${SOURCE_EVENT}",
              "issue_number": "${ISSUE_NUMBER}",
              "pr_number": "${PR_NUMBER}",
              "comment_id": "${COMMENT_ID}",
              "actor": "${ACTOR}"
            }
          }
          EOF
