name: Governance Relay

on:
  issues:
    types:
      - opened

  issue_comment:
    types:
      - created

  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft
      - closed

  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  issues: read

jobs:
  relay:
    if: >-
      github.event_name != 'pull_request_review' &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request == null && github.event.comment.body == '/claim')) &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name != github.repository)

    runs-on: ubuntu-latest

    concurrency:
      group: relay-${{ github.repository }}-${{ github.event_name == 'issue_comment' && format('claim-issue-{0}', github.event.issue.number) || format('{0}-{1}', github.event_name, github.run_id) }}
      queue: max

    steps:
      - name: Dispatch lifecycle event
        if: >-
          github.event_name != 'issue_comment' ||
          (
            github.event.issue.state == 'open' &&
            github.event.issue.assignee == null &&
            contains(github.event.issue.labels.*.name, 'status: available')
          )
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_DISPATCH_TOKEN }}
          DISPATCH_EVENT_TYPE: ${{ github.event_name == 'issues' && 'northstarops-publish-event' || github.event_name == 'issue_comment' && 'northstarops-claim-event' || 'northstarops-governance-event' }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "FAIL_CLOSED: governance dispatch token unavailable"; exit 1; }

          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/softbreakcodes/northstarops-governance-private-test/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<EOF
          {
            "event_type": "${DISPATCH_EVENT_TYPE}",
            "client_payload": {
              "source_repo": "${SOURCE_REPO}",
              "source_event": "${SOURCE_EVENT}",
              "source_action": "${SOURCE_ACTION}",
              "issue_number": "${ISSUE_NUMBER}",
              "pr_number": "${PR_NUMBER}",
              "comment_id": "${COMMENT_ID}",
              "review_id": "${REVIEW_ID}",
              "actor": "${ACTOR}"
            }
          }
          EOF

  capture-review:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-latest

    concurrency:
      group: review-capture-${{ github.repository }}-${{ github.event.review.id }}
      queue: max

    steps:
      - name: Capture review event without secrets
        shell: bash
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          ACTOR: ${{ github.actor }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "${SOURCE_EVENT}" != "pull_request_review" ] || [ "${SOURCE_ACTION}" != "submitted" ]; then
            echo "FAIL_CLOSED: unexpected review capture event"
            exit 1
          fi

          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${REVIEW_ID}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || [ -z "${ACTOR}" ]; then
            echo "FAIL_CLOSED: malformed review capture payload"
            exit 1
          fi

          jq -n \
            --arg source_repo "${SOURCE_REPO}" \
            --arg source_event "${SOURCE_EVENT}" \
            --arg source_action "${SOURCE_ACTION}" \
            --arg pr_number "${PR_NUMBER}" \
            --arg review_id "${REVIEW_ID}" \
            --arg actor "${ACTOR}" \
            --arg source_run_id "${SOURCE_RUN_ID}" \
            '{source_repo:$source_repo,source_event:$source_event,source_action:$source_action,pr_number:$pr_number,review_id:$review_id,actor:$actor,source_run_id:$source_run_id}' \
            > review-payload.json

      - name: Upload review relay payload
        uses: actions/upload-artifact@v4
        with:
          name: governance-review-payload
          path: review-payload.json
          if-no-files-found: error
          retention-days: 1
